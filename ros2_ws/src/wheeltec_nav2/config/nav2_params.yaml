# Nav2 导航参数 — 2D 差分驱动 + LSN10 360° 激光

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2       # 旋转噪声（旋转带来的旋转误差）
    alpha2: 0.2       # 平移噪声（平移带来的旋转误差）
    alpha3: 0.2       # 平移噪声（平移带来的平移误差）
    alpha4: 0.2       # 旋转噪声（旋转带来的平移误差）
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0        # LSN10 有效建图距离
    laser_min_range: 0.3
    laser_model_type: "likelihood_field"
    max_beams: 60                # 360°雷达抽60根束，降低计算
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05           # 转约2.9度即更新，减少转弯定位滞后
    update_min_d: 0.10           # 移动10cm即更新
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    set_initial_pose: false      # 手动在 Rviz 给初始位姿
    always_reset_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - wheeltec_nav2_bt_nodes

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.15
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10      # 终点±10cm
      yaw_goal_tolerance: 3.14159  # 到达位置后由IMU闭环完成最终朝向

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: -0.15              # 允许低速倒退
      max_vel_x: 0.15               # 建图后首次导航先限制为 0.15 m/s
      max_vel_y: 0.0                # 不能侧移
      min_vel_y: 0.0
      max_vel_theta: 0.80           # 底盘原地旋转范围
      min_vel_theta: -0.80
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      min_speed_xy: 0.15            # 低于此速度底盘可能无法起步
      max_speed_xy: 0.15
      min_speed_theta: 0.60         # 底盘低于此速度无法起转
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: "/local_costmap/costmap_raw"
    global_costmap_topic: "/global_costmap/costmap_raw"
    local_footprint_topic: "/local_costmap/published_footprint"
    global_footprint_topic: "/global_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive", "wait"]
    spin:
      plugin: "wheeltec_nav2/ImuSpin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "map"
    robot_base_frame: "base_link"
    transform_tolerance: 0.5
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.80
    min_rotational_vel: 0.60
    rotational_acc_lim: 1.5
    imu_topic: "/imu/data"
    imu_min_angular_speed: 0.60
    imu_max_angular_speed: 0.80
    imu_proportional_gain: 1.8
    imu_slow_down_angle: 0.45
    imu_angle_tolerance: 0.045
    imu_timeout_sec: 0.25
    imu_pulse_period_sec: 0.24
    imu_pulse_on_sec: 0.08

# 全局代价地图
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_link"
      rolling_window: false         # 全局静态，不滚动
      resolution: 0.05              # 5cm，和建图分辨率一致
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: "[[-0.15, -0.10], [0.15, -0.10], [0.15, 0.10], [-0.15, 0.10]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3

# 局部代价地图
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      rolling_window: true          # 局部滚动窗口
      width: 4                      # 4m × 4m 窗口
      height: 4
      resolution: 0.05
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: "[[-0.15, -0.10], [0.15, -0.10], [0.15, 0.10], [-0.15, 0.10]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3

# 地图服务器
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""              # 通过 launch 参数传入

# 速度平滑器（可选）
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 0.80]
    min_velocity: [-0.15, 0.0, -0.80]
    max_accel: [0.4, 0.0, 1.5]
    max_decel: [-0.4, 0.0, -1.5]
    odom_topic: "/odom"
