chassis_bridge:
  ros__parameters:
    serial_port: "/dev/chassis"
    serial_baud: 115200
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true
    serial_poll_rate_hz: 200.0
    command_rate_hz: 50.0
    command_timeout_sec: 0.5
    left_meters_per_count: 0.0002613638
    right_meters_per_count: 0.0002611298
    wheel_separation: 0.1431
    integrate_odom_from_wheel_counts: true
    use_imu_yaw: true
    imu_topic: "/imu/data"
    imu_yaw_sign: 1.0
    imu_timeout_sec: 0.2
    imu_max_delta_rad: 0.25
    imu_force_gyro_yaw: true
    imu_gyro_deadband_rad_s: 0.03
