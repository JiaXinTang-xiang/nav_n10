# 底盘串口桥接参数
chassis_bridge:
  ros__parameters:
    serial_port: "/dev/chassis"     # 底盘 STM32 串口 (udev 固定名)
    serial_baud: 115200
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true
    command_rate_hz: 20.0         # 向 STM32 重发速度指令的频率
    command_timeout_sec: 0.5      # /cmd_vel 超时后自动停车
